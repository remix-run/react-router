            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'parse_token_usage.cjs'));
            await main();
      - name: Conclude threat detection
        id: detection_conclusion
        if: always()
        continue-on-error: true
        env:
          RUN_DETECTION: ${{ steps.detection_guard.outputs.run_detection }}
          DETECTION_AGENTIC_EXECUTION_OUTCOME: ${{ steps.detection_agentic_execution.outcome }}
          GH_AW_DETECTION_CONTINUE_ON_ERROR: "true"
        run: |
          bash "${RUNNER_TEMP}/gh-aw/actions/conclude_threat_detection.sh" /tmp/gh-aw/threat-detection/detection_result.json

  pre_activation:
    if: >
      (github.event_name != 'issue_comment' || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) &&
      (contains(github.event.comment.body, '@remix-run-bot'))
    runs-on: ubuntu-slim
    env:
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
    outputs:
      activated: ${{ steps.check_membership.outputs.is_team_member == 'true' && steps.check_skip_bots.outputs.skip_bots_ok == 'true' }}
      matched_command: ''
      setup-parent-span-id: ${{ steps.setup.outputs.parent-span-id || steps.setup.outputs.span-id }}
      setup-span-id: ${{ steps.setup.outputs.span-id }}
      setup-trace-id: ${{ steps.setup.outputs.trace-id }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw-actions/setup@5e508589e03a7757a7e05b26e834292f5445bfb6 # v0.88.7
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "React Router bot comment router"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/aw-comment-router.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "0.150.1"
          GH_AW_INFO_AWF_VERSION: "v0.28.14"
          GH_AW_INFO_ENGINE_ID: "codex"
      - name: Check team membership for workflow
        id: check_membership
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_REQUIRED_ROLES: "admin"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'check_membership.cjs'));
            await main();
      - name: Check skip-bots
        id: check_skip_bots
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_SKIP_BOTS: "dependabot,renovate,github-actions,copilot-swe-agent,Copilot,copilot,@app/copilot-swe-agent,remix-run-bot"
          GH_AW_WORKFLOW_NAME: "React Router bot comment router"
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'check_skip_bots.cjs'));
            await main();

  route_agent_workflow:
    needs:
      - agent
      - detection
    if: (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'route_agent_workflow')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download agent output artifact
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{agent,agent-output-fallback}"
          merge-multiple: true
          path: ${{ runner.temp }}/gh-aw/safe-jobs/
      - name: Queue the route or request clarification
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 (source v9)
        env:
          EXPECTED_BOT_MENTION: "@remix-run-bot"
          EXPECTED_REPOSITORY: remix-run/react-router
          GH_AW_AGENT_OUTPUT: ${{ runner.temp }}/gh-aw/safe-jobs/agent_output.json
        with:
          github-token: ${{ secrets.GH_REMIX_PAT_AW }}
          script: |
            const crypto = require('crypto')
            const fs = require('fs')

            if (
              !['issue_comment', 'discussion_comment'].includes(context.eventName) ||
              context.payload.action !== 'created'
            ) {
              core.setFailed('This output is restricted to newly created comments')
              return
            }

            if (process.env.GITHUB_REPOSITORY !== process.env.EXPECTED_REPOSITORY) {
              core.setFailed('This output is restricted to remix-run/react-router')
              return
            }

            const comment = context.payload.comment
            const actor = comment?.user?.login
            const body = comment?.body ?? ''
            const mention = process.env.EXPECTED_BOT_MENTION.slice(1)
            if (
              !actor ||
              !Number.isSafeInteger(comment?.id) ||
              typeof comment.updated_at !== 'string' ||
              !new RegExp(`@${mention}(?![a-z0-9-])`, 'i').test(body)
            ) {
              core.setFailed('The triggering comment is not a valid routed administrator request')
              return
            }

            const permission = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo,
              username: actor,
            })
            if (permission.data.permission !== 'admin') {
              core.setFailed('Only repository administrators may route agentic workflows')
              return
            }

            const outputPath = process.env.GH_AW_AGENT_OUTPUT
            if (!outputPath || !fs.existsSync(outputPath)) {
              core.setFailed('Agent output was not found')
              return
            }

            const output = JSON.parse(fs.readFileSync(outputPath, 'utf8'))
            const items = output.items.filter((item) => item.type === 'route_agent_workflow')
            if (items.length !== 1) {
              core.setFailed('The router must produce exactly one routing decision')
              return
            }

            const item = items[0]
            const isDiscussion = context.eventName === 'discussion_comment'
            const issue = context.payload.issue
            const discussion = context.payload.discussion
            const itemType = isDiscussion
              ? 'discussion'
              : issue?.pull_request
                ? 'pull_request'
                : 'issue'
            const itemNumber = isDiscussion ? discussion?.number : issue?.number
            const routes = {
              review: {
                issue: 'aw-command-review-issue.lock.yml',
                pull_request: 'aw-command-review-pull-request.lock.yml',
                discussion: 'aw-command-review-proposal.lock.yml',
              },
              implement: {
                issue: 'aw-command-implement.lock.yml',
                discussion: 'aw-command-implement.lock.yml',
              },
              iterate: {
                pull_request: 'aw-command-iterate.lock.yml',
              },
            }

            if (item.workflow === 'clarify') {
              const clarification = item.clarification?.trim() ?? ''
              if (!clarification || clarification.length > 1000) {
                core.setFailed('A clarification must contain between 1 and 1000 characters')
                return
              }

              if (isDiscussion) {
                await github.graphql(
                  `mutation($discussionId: ID!, $replyToId: ID!, $body: String!) {
                    addDiscussionComment(input: {
                      discussionId: $discussionId
                      replyToId: $replyToId
                      body: $body
                    }) {
                      comment { id }
                    }
                  }`,
                  {
                    discussionId: discussion.node_id,
                    replyToId: comment.node_id,
                    body: clarification,
                  }
                )
              } else {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: issue.number,
                  body: clarification,
                })
              }
              return
            }

            const workflowFile = routes[item.workflow]?.[itemType]
            if (!workflowFile || item.clarification) {
              core.setFailed('Invalid routing output for the triggering item')
              return
            }
            if (isDiscussion && discussion?.category?.slug !== 'proposals') {
              core.setFailed('Discussion mention routing is restricted to Proposal Discussions')
              return
            }

            const label = isDiscussion ? null : `aw:${item.workflow}`
            // Bot-added command labels acknowledge the route without triggering it.
            // Issue review uses the separate aw:implement-bot label for handoffs.
            if (label) {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: itemNumber,
                labels: [label],
              })
            }

            const commentRouterContext = {
              version: 1,
              repository: process.env.EXPECTED_REPOSITORY,
              router_workflow: '.github/workflows/aw-comment-router.lock.yml',
              router_run_id: Number(process.env.GITHUB_RUN_ID),
              event_type: context.eventName,
              item_type: itemType,
              item_number: itemNumber,
              comment_id: comment.id,
              comment_node_id: isDiscussion ? comment.node_id : null,
              comment_updated_at: comment.updated_at,
              comment_body_sha256: crypto.createHash('sha256').update(body, 'utf8').digest('hex'),
              actor,
              workflow: item.workflow,
              label,
            }

            try {
              // workflow_dispatch returns after GitHub accepts the event. Do not look up or
              // wait for the command run.
              await github.rest.actions.createWorkflowDispatch({
                ...context.repo,
                workflow_id: workflowFile,
                ref: context.payload.repository.default_branch,
                inputs: { aw_context: JSON.stringify(commentRouterContext) },
              })
            } finally {
              if (label) {
                try {
                  await github.rest.issues.removeLabel({
                    ...context.repo,
                    issue_number: itemNumber,
                    name: label,
                  })
                } catch (error) {
                  if (error.status !== 404) throw error
                }
              }
            }
            return

  safe_outputs:
    needs:
      - activation
      - agent
      - detection
    if: (!cancelled()) && needs.agent.result != 'skipped' && needs.detection.result == 'success'
    runs-on: ubuntu-slim
    permissions:
      issues: write
    timeout-minutes: 45
    env:
      GH_AW_AGENT_AIC: ${{ needs.agent.outputs.aic }}
      GH_AW_AIC: ${{ needs.agent.outputs.aic }}
      GH_AW_AMBIENT_CONTEXT: ${{ needs.agent.outputs.ambient_context }}
      GH_AW_CALLER_WORKFLOW_ID: "${{ github.repository }}/aw-comment-router"
      GH_AW_DETECTION_CONCLUSION: ${{ needs.detection.outputs.detection_conclusion }}
      GH_AW_DETECTION_REASON: ${{ needs.detection.outputs.detection_reason }}
      GH_AW_EFFECTIVE_TOKENS: ${{ needs.agent.outputs.effective_tokens }}
      GH_AW_ENGINE_ID: "codex"
      GH_AW_ENGINE_MODEL: "gpt-5.6-terra"
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
      GH_AW_THREAT_DETECTION_AIC: ${{ needs.detection.outputs.aic }}
      GH_AW_WORKFLOW_EMOJI: "🤖"
      GH_AW_WORKFLOW_ID: "aw-comment-router"
      GH_AW_WORKFLOW_NAME: "React Router bot comment router"
      GH_AW_WORKFLOW_SOURCE_URL: "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/.github/workflows/aw-comment-router.md"
    outputs:
      code_push_failure_count: ${{ steps.process_safe_outputs.outputs.code_push_failure_count }}
      code_push_failure_errors: ${{ steps.process_safe_outputs.outputs.code_push_failure_errors }}
      create_discussion_error_count: ${{ steps.process_safe_outputs.outputs.create_discussion_error_count }}
      create_discussion_errors: ${{ steps.process_safe_outputs.outputs.create_discussion_errors }}
      process_safe_outputs_items_applied: ${{ steps.process_safe_outputs.outputs.items_applied }}
      process_safe_outputs_items_cancelled: ${{ steps.process_safe_outputs.outputs.items_cancelled }}
      process_safe_outputs_items_deferred: ${{ steps.process_safe_outputs.outputs.items_deferred }}
      process_safe_outputs_items_failed: ${{ steps.process_safe_outputs.outputs.items_failed }}
      process_safe_outputs_items_skipped: ${{ steps.process_safe_outputs.outputs.items_skipped }}
      process_safe_outputs_items_succeeded: ${{ steps.process_safe_outputs.outputs.items_succeeded }}
      process_safe_outputs_items_warnings: ${{ steps.process_safe_outputs.outputs.items_warnings }}
      process_safe_outputs_processed_count: ${{ steps.process_safe_outputs.outputs.processed_count }}
      process_safe_outputs_status: ${{ steps.process_safe_outputs.outputs.status }}
      process_safe_outputs_temporary_id_map: ${{ steps.process_safe_outputs.outputs.temporary_id_map }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw-actions/setup@5e508589e03a7757a7e05b26e834292f5445bfb6 # v0.88.7
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
          trace-id: ${{ needs.activation.outputs.setup-trace-id }}
          parent-span-id: ${{ needs.activation.outputs.setup-parent-span-id || needs.activation.outputs.setup-span-id }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "React Router bot comment router"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/aw-comment-router.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "0.150.1"
          GH_AW_INFO_AWF_VERSION: "v0.28.14"
          GH_AW_INFO_ENGINE_ID: "codex"
      - name: Mask OTLP telemetry headers
        run: bash "${RUNNER_TEMP}/gh-aw/actions/mask_otlp_headers.sh"
      - name: Download agent output artifact
        id: download-agent-output
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{agent,agent-output-fallback}"
          merge-multiple: true
          path: /tmp/gh-aw/
      - name: Setup agent output environment variable
        id: setup-agent-output-env
        if: steps.download-agent-output.outcome == 'success'
        run: |
          mkdir -p /tmp/gh-aw/
          find "/tmp/gh-aw/" -type f -print
          if [ -f "/tmp/gh-aw/agent_output.json" ]; then
            echo "GH_AW_AGENT_OUTPUT=/tmp/gh-aw/agent_output.json" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure GH_HOST for enterprise compatibility
        id: ghes-host-config
        shell: bash
        run: | # zizmor: ignore[github-env] - GITHUB_SERVER_URL is set by GitHub Actions, not user input.
          # Derive GH_HOST from GITHUB_SERVER_URL so the gh CLI targets the correct
          # GitHub instance (GHES/GHEC). On github.com this is a harmless no-op.
          GH_HOST="${GITHUB_SERVER_URL#https://}"
          GH_HOST="${GH_HOST#http://}"
          echo "GH_HOST=${GH_HOST}" >> "$GITHUB_ENV"
      - name: Process Safe Outputs
        id: process_safe_outputs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_AGENT_OUTPUT: ${{ steps.setup-agent-output-env.outputs.GH_AW_AGENT_OUTPUT }}
          GH_AW_COMMENT_ID: ${{ needs.activation.outputs.comment_id }}
          GH_AW_ALLOWED_DOMAINS: "api.snapcraft.io,archive.ubuntu.com,azure.archive.ubuntu.com,crl.geotrust.com,crl.globalsign.com,crl.identrust.com,crl.sectigo.com,crl.thawte.com,crl.usertrust.com,crl.verisign.com,crl3.digicert.com,crl4.digicert.com,crls.ssl.com,json-schema.org,json.schemastore.org,keyserver.ubuntu.com,ocsp.digicert.com,ocsp.geotrust.com,ocsp.globalsign.com,ocsp.identrust.com,ocsp.sectigo.com,ocsp.ssl.com,ocsp.thawte.com,ocsp.usertrust.com,ocsp.verisign.com,packagecloud.io,packages.cloud.google.com,packages.microsoft.com,ppa.launchpad.net,s.symcb.com,s.symcd.com,security.ubuntu.com,ts-crl.ws.symantec.com,ts-ocsp.ws.symantec.com,www.googleapis.com"
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_API_URL: ${{ github.api_url }}
          GH_AW_SAFE_OUTPUT_JOBS: "{\"route_agent_workflow\":\"\"}"
          GH_AW_SAFE_OUTPUTS_HANDLER_CONFIG: "{\"create_report_incomplete_issue\":{},\"missing_data\":{},\"missing_tool\":{},\"noop\":{\"max\":1,\"report-as-issue\":\"false\"},\"report_incomplete\":{}}"
        with:
          github-token: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'process_safe_outputs.cjs'));
            await main();
      - name: Upload Safe Outputs Items
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: safe-outputs-items
          path: |
            /tmp/gh-aw/safe-output-items.jsonl
            /tmp/gh-aw/temporary-id-map.json
            /tmp/gh-aw/safe-output-errors.json
          if-no-files-found: ignore
