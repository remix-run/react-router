            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'compute_text.cjs'));
            await main();
      - name: Log runtime features
        if: ${{ contains(toJSON(vars), '"GH_AW_RUNTIME_FEATURES":') }}
        run: bash "${RUNNER_TEMP}/gh-aw/actions/log_runtime_features_summary.sh"
      - name: Create prompt with built-in context
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_ACTIONS_DIR: ${{ runner.temp }}/gh-aw/actions
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
          GH_AW_SAFE_OUTPUTS: ${{ runner.temp }}/gh-aw/safeoutputs/outputs.jsonl
          GH_AW_PROMPT_CONFIG: "{\"items\":[{\"content_env\":\"GH_AW_PROMPT_CONTENT_0000\"},{\"file\":\"xpia.md\"},{\"file\":\"temp_folder_prompt.md\"},{\"file\":\"markdown.md\"},{\"file\":\"safe_outputs_prompt.md\"},{\"content_env\":\"GH_AW_PROMPT_CONTENT_0001\"},{\"content_env\":\"GH_AW_PROMPT_CONTENT_0002\"},{\"content_env\":\"GH_AW_PROMPT_CONTENT_0003\"},{\"file\":\"github_mcp_tools_with_safeoutputs_prompt.md\"},{\"content_env\":\"GH_AW_PROMPT_CONTENT_0004\"},{\"content_env\":\"GH_AW_PROMPT_CONTENT_0005\"},{\"content_env\":\"GH_AW_PROMPT_CONTENT_0006\"}]}"
          GH_AW_EXPR_1A3A194A: ${{ github.event.discussion.number || (fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_type == 'discussion' && fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_number) }}
          GH_AW_EXPR_463A214A: ${{ github.event.pull_request.number || (fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_type == 'pull_request' && fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_number) }}
          GH_AW_EXPR_802A9F6A: ${{ github.event.issue.number || (fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_type == 'issue' && fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_number) }}
          GH_AW_EXPR_FF1D34CE: ${{ github.event.comment.id || fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').comment_id }}
          GH_AW_GITHUB_ACTOR: ${{ github.actor }}
          GH_AW_GITHUB_EVENT_INPUTS_AW_CONTEXT: ${{ github.event.inputs.aw_context }}
          GH_AW_GITHUB_REPOSITORY: ${{ github.repository }}
          GH_AW_GITHUB_RUN_ID: ${{ github.run_id }}
          GH_AW_GITHUB_WORKSPACE: ${{ github.workspace }}
          GH_AW_STEPS_SANITIZED_OUTPUTS_TEXT: ${{ steps.sanitized.outputs.text }}
          GH_AW_PROMPT_CONTENT_0000: "<system>\n"
          GH_AW_PROMPT_CONTENT_0001: "<safe-output-tools>\nTools: add_comment, missing_tool, missing_data, noop\n"
          GH_AW_PROMPT_CONTENT_0002: "</safe-output-tools>\n"
          GH_AW_PROMPT_CONTENT_0003: "<github-context>\nThe following GitHub context information is available for this workflow:\n{{#if github.actor}}\n- **actor**: __GH_AW_GITHUB_ACTOR__\n{{/if}}\n{{#if github.repository}}\n- **repository**: __GH_AW_GITHUB_REPOSITORY__\n{{/if}}\n{{#if github.workspace}}\n- **workspace**: __GH_AW_GITHUB_WORKSPACE__\n{{/if}}\n{{#if github.event.issue.number || (github.aw.context.item_type == 'issue' && github.aw.context.item_number)}}\n- **issue-number**: #__GH_AW_EXPR_802A9F6A__\n{{/if}}\n{{#if github.event.discussion.number || (github.aw.context.item_type == 'discussion' && github.aw.context.item_number)}}\n- **discussion-number**: #__GH_AW_EXPR_1A3A194A__\n{{/if}}\n{{#if github.event.pull_request.number || (github.aw.context.item_type == 'pull_request' && github.aw.context.item_number)}}\n- **pull-request-number**: #__GH_AW_EXPR_463A214A__\n{{/if}}\n{{#if github.event.comment.id || github.aw.context.comment_id}}\n- **comment-id**: __GH_AW_EXPR_FF1D34CE__\n{{/if}}\n{{#if github.run_id}}\n- **workflow-run-id**: __GH_AW_GITHUB_RUN_ID__\n{{/if}}\n</github-context>\n\n"
          GH_AW_PROMPT_CONTENT_0004: "</system>\n"
          GH_AW_PROMPT_CONTENT_0005: "{{#runtime-import .github/workflows/shared/resolve-command-request.md}}\n"
          GH_AW_PROMPT_CONTENT_0006: "{{#runtime-import .github/workflows/aw-command-review-proposal.md}}\n"
        with:
          script: |
            const { setupGlobals } = require(process.env.GH_AW_ACTIONS_DIR + '/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(process.env.GH_AW_ACTIONS_DIR + '/create_prompt.cjs');
            await main(core);
      - name: Interpolate variables and render templates
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
          GH_AW_ENGINE_ID: "codex"
          GH_AW_GITHUB_EVENT_INPUTS_AW_CONTEXT: ${{ github.event.inputs.aw_context }}
          GH_AW_STEPS_SANITIZED_OUTPUTS_TEXT: ${{ steps.sanitized.outputs.text }}
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'interpolate_prompt.cjs'));
            await main();
      - name: Substitute placeholders
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
          GH_AW_EXPR_1A3A194A: ${{ github.event.discussion.number || (fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_type == 'discussion' && fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_number) }}
          GH_AW_EXPR_463A214A: ${{ github.event.pull_request.number || (fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_type == 'pull_request' && fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_number) }}
          GH_AW_EXPR_802A9F6A: ${{ github.event.issue.number || (fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_type == 'issue' && fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_number) }}
          GH_AW_EXPR_FF1D34CE: ${{ github.event.comment.id || fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').comment_id }}
          GH_AW_GITHUB_ACTOR: ${{ github.actor }}
          GH_AW_GITHUB_EVENT_INPUTS_AW_CONTEXT: ${{ github.event.inputs.aw_context }}
          GH_AW_GITHUB_REPOSITORY: ${{ github.repository }}
          GH_AW_GITHUB_RUN_ID: ${{ github.run_id }}
          GH_AW_GITHUB_WORKSPACE: ${{ github.workspace }}
          GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_ACTIVATED: ${{ needs.pre_activation.outputs.activated }}
          GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_MATCHED_COMMAND: ${{ needs.pre_activation.outputs.matched_command }}
          GH_AW_STEPS_SANITIZED_OUTPUTS_TEXT: ${{ steps.sanitized.outputs.text }}
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);

            const substitutePlaceholders = require(path.join(actionsDir, 'substitute_placeholders.cjs'));

            // Call the substitution function
            return await substitutePlaceholders({
              file: process.env.GH_AW_PROMPT,
              substitutions: {
                GH_AW_EXPR_1A3A194A: process.env.GH_AW_EXPR_1A3A194A,
                GH_AW_EXPR_463A214A: process.env.GH_AW_EXPR_463A214A,
                GH_AW_EXPR_802A9F6A: process.env.GH_AW_EXPR_802A9F6A,
                GH_AW_EXPR_FF1D34CE: process.env.GH_AW_EXPR_FF1D34CE,
                GH_AW_GITHUB_ACTOR: process.env.GH_AW_GITHUB_ACTOR,
                GH_AW_GITHUB_EVENT_INPUTS_AW_CONTEXT: process.env.GH_AW_GITHUB_EVENT_INPUTS_AW_CONTEXT,
                GH_AW_GITHUB_REPOSITORY: process.env.GH_AW_GITHUB_REPOSITORY,
                GH_AW_GITHUB_RUN_ID: process.env.GH_AW_GITHUB_RUN_ID,
                GH_AW_GITHUB_WORKSPACE: process.env.GH_AW_GITHUB_WORKSPACE,
                GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_ACTIVATED: process.env.GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_ACTIVATED,
                GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_MATCHED_COMMAND: process.env.GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_MATCHED_COMMAND,
                GH_AW_STEPS_SANITIZED_OUTPUTS_TEXT: process.env.GH_AW_STEPS_SANITIZED_OUTPUTS_TEXT
              }
            });
      - name: Validate prompt placeholders
        env:
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
        run: |
          bash "${RUNNER_TEMP}/gh-aw/actions/validate_prompt_placeholders.sh"
      - name: Print prompt
        env:
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
        run: |
          bash "${RUNNER_TEMP}/gh-aw/actions/print_prompt_summary.sh"
      - name: Stage prompt files for artifact upload
        run: |
          mkdir -p /tmp/gh-aw/aw-prompts
          cp -a "${RUNNER_TEMP}/gh-aw/aw-prompts/." /tmp/gh-aw/aw-prompts/
      - name: Upload activation artifact
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: activation
          include-hidden-files: true
          path: |
            /tmp/gh-aw/aw_info.json
            /tmp/gh-aw/models.json
            /tmp/gh-aw/aw-prompts/prompt.txt
            /tmp/gh-aw/aw-prompts/prompt-template.txt
            /tmp/gh-aw/aw-prompts/prompt-import-tree.json
            /tmp/gh-aw/github_rate_limits.jsonl
            /tmp/gh-aw/base
            /tmp/gh-aw/.codex/agents
            /tmp/gh-aw/.codex/skills
          if-no-files-found: ignore
          retention-days: 1

  agent:
    needs: activation
    if: needs.activation.outputs.daily_ai_credits_exceeded != 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      discussions: read
      issues: read
      pull-requests: read
    timeout-minutes: 60
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_AW_ASSETS_ALLOWED_EXTS: ""
      GH_AW_ASSETS_BRANCH: ""
      GH_AW_ASSETS_MAX_SIZE_KB: 0
      GH_AW_MCP_LOG_DIR: /tmp/gh-aw/mcp-logs/safeoutputs
      GH_AW_PR_HEAD_BASE_BRANCH: ""
      GH_AW_PR_HEAD_BASE_PR_NUMBER: ""
      GH_AW_PR_HEAD_BASE_REF: ""
      GH_AW_PR_HEAD_BASE_REPO: ""
      GH_AW_PR_HEAD_BASE_SHA: ""
      GH_AW_PR_HEAD_REPO: ""
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
      GH_AW_WORKFLOW_ID_SANITIZED: awcommandreviewproposal
    outputs:
      agentic_engine_timeout: ${{ steps.detect-agent-errors.outputs.agentic_engine_timeout || 'false' }}
      ai_credits_rate_limit_error: ${{ steps.parse-mcp-gateway.outputs.ai_credits_rate_limit_error || 'false' }}
      aic: ${{ steps.parse-mcp-gateway.outputs.aic }}
      ambient_context: ${{ steps.parse-mcp-gateway.outputs.ambient_context }}
      effective_tokens: ${{ steps.parse-mcp-gateway.outputs.effective_tokens }}
      has_patch: ${{ steps.collect_output.outputs.has_patch }}
      http_400_response_error: ${{ steps.detect-agent-errors.outputs.http_400_response_error || 'false' }}
      inference_access_error: ${{ steps.detect-agent-errors.outputs.inference_access_error || 'false' }}
      invocation_cap_exceeded: ${{ steps.detect-agent-errors.outputs.invocation_cap_exceeded || 'false' }}
      max_cache_misses_exceeded: ${{ steps.detect-agent-errors.outputs.max_cache_misses_exceeded || 'false' }}
      mcp_policy_error: ${{ steps.detect-agent-errors.outputs.mcp_policy_error || 'false' }}
      missing_model_pricing_error: ${{ steps.detect-agent-errors.outputs.missing_model_pricing_error || 'false' }}
      missing_model_pricing_model_name: ${{ steps.detect-agent-errors.outputs.missing_model_pricing_model_name || '' }}
      model: ${{ needs.activation.outputs.model }}
      model_not_supported_error: ${{ steps.detect-agent-errors.outputs.model_not_supported_error || 'false' }}
      output: ${{ steps.collect_output.outputs.output }}
      output_types: ${{ steps.collect_output.outputs.output_types }}
      setup-parent-span-id: ${{ steps.setup.outputs.parent-span-id || steps.setup.outputs.span-id }}
      setup-span-id: ${{ steps.setup.outputs.span-id }}
      setup-trace-id: ${{ steps.setup.outputs.trace-id }}
      shell_expansion_guard_rejected: ${{ steps.detect-agent-errors.outputs.shell_expansion_guard_rejected || 'false' }}
      unknown_model_ai_credits: ${{ steps.parse-mcp-gateway.outputs.unknown_model_ai_credits || 'false' }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw-actions/setup@9271a1804551c0dc4fb0085a97979950aa2f8489 # v0.88.2
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
          trace-id: ${{ needs.activation.outputs.setup-trace-id }}
          parent-span-id: ${{ needs.activation.outputs.setup-parent-span-id || needs.activation.outputs.setup-span-id }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "/review proposal"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/aw-command-review-proposal.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "0.150.1"
          GH_AW_INFO_AWF_VERSION: "v0.28.12"
          GH_AW_INFO_ENGINE_ID: "codex"
      - name: Set runtime paths
        id: set-runtime-paths
        env:
          GH_AW_RUNNER_TOOL_CACHE: ${{ runner.tool_cache }}
        run: |
          if [ -z "${RUNNER_TOOL_CACHE:-}" ]; then
            echo "RUNNER_TOOL_CACHE=${GH_AW_RUNNER_TOOL_CACHE}" >> "$GITHUB_ENV"
          fi
          {
            echo "GH_AW_SAFE_OUTPUTS=${RUNNER_TEMP}/gh-aw/safeoutputs/outputs.jsonl"
            echo "GH_AW_SAFE_OUTPUTS_CONFIG_PATH=${RUNNER_TEMP}/gh-aw/safeoutputs/config.json"
            echo "GH_AW_SAFE_OUTPUTS_TOOLS_PATH=${RUNNER_TEMP}/gh-aw/safeoutputs/tools.json"
          } >> "$GITHUB_OUTPUT"
      - name: Mask OTLP telemetry headers
        run: bash "${RUNNER_TEMP}/gh-aw/actions/mask_otlp_headers.sh"
      - name: Check OTLP telemetry configuration
        run: bash "${RUNNER_TEMP}/gh-aw/actions/check_otlp_default_credentials.sh"
      - name: Create gh-aw temp directory
        run: bash "${RUNNER_TEMP}/gh-aw/actions/create_gh_aw_tmp_dir.sh"
      - name: Configure gh CLI for GitHub Enterprise
        run: bash "${RUNNER_TEMP}/gh-aw/actions/configure_gh_for_ghe.sh"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download activation artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: activation
          path: /tmp/gh-aw
      - env:
          BOT_LOGIN: remix-run-bot
          EXPECTED_REPOSITORY: remix-run/remix
          ROUTER_WORKFLOW: .github/workflows/aw-comment-router.lock.yml
        id: trusted-request
        name: Validate trusted administrator request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 (source v9)
        with:
          script: "const crypto = require('crypto')\nconst botLogin = process.env.BOT_LOGIN.toLowerCase()\nconst expectedRepository = process.env.EXPECTED_REPOSITORY.toLowerCase()\nconst workflowByName = {\n  '/review issue': { workflow: 'review', itemTypes: ['issue'] },\n  '/review pull request': { workflow: 'review', itemTypes: ['pull_request'] },\n  '/review proposal': { workflow: 'review', itemTypes: ['discussion'] },\n  '/implement': { workflow: 'implement', itemTypes: ['issue', 'discussion'] },\n  '/iterate': { workflow: 'iterate', itemTypes: ['pull_request'] },\n}\n\nfunction hasExactBotMention(body) {\n  return new RegExp(`@${botLogin}(?![a-z0-9-])`, 'i').test(body)\n}\n\nfunction bodyHash(body) {\n  return crypto.createHash('sha256').update(body, 'utf8').digest('hex')\n}\n\nasync function isRepositoryAdmin(login) {\n  if (!login) return false\n  try {\n    const response = await github.rest.repos.getCollaboratorPermissionLevel({\n      ...context.repo,\n      username: login,\n    })\n    return response.data.permission === 'admin'\n  } catch (error) {\n    if (error.status === 404) return false\n    throw error\n  }\n}\n\nif (context.eventName === 'workflow_dispatch') {\n  if ((context.actor ?? process.env.GITHUB_ACTOR)?.toLowerCase() !== botLogin) {\n    core.setFailed('Only remix-run-bot may dispatch a routed workflow')\n    return\n  }\n\n  let commentRouterContext\n  try {\n    commentRouterContext = JSON.parse(context.payload.inputs?.aw_context ?? '')\n  } catch {\n    core.setFailed('The comment router context is not valid JSON')\n    return\n  }\n\n  const expectedWorkflow = workflowByName[context.workflow]\n  if (!expectedWorkflow) {\n    core.setFailed('The dispatched workflow is not a supported agentic command')\n    return\n  }\n\n  const validBaseContext =\n    commentRouterContext?.version === 1 &&\n    commentRouterContext.repository?.toLowerCase() === expectedRepository &&\n    commentRouterContext.router_workflow === process.env.ROUTER_WORKFLOW &&\n    Number.isSafeInteger(commentRouterContext.router_run_id) &&\n    ['issue_comment', 'discussion_comment'].includes(commentRouterContext.event_type) &&\n    expectedWorkflow.itemTypes.includes(commentRouterContext.item_type) &&\n    Number.isSafeInteger(commentRouterContext.item_number) &&\n    commentRouterContext.item_number > 0 &&\n    Number.isSafeInteger(commentRouterContext.comment_id) &&\n    commentRouterContext.comment_id > 0 &&\n    typeof commentRouterContext.actor === 'string' &&\n    commentRouterContext.workflow === expectedWorkflow.workflow &&\n    commentRouterContext.label ===\n      (commentRouterContext.item_type === 'discussion'\n        ? null\n        : `aw:${expectedWorkflow.workflow}`) &&\n    typeof commentRouterContext.comment_updated_at === 'string' &&\n    !Number.isNaN(Date.parse(commentRouterContext.comment_updated_at)) &&\n    /^[0-9a-f]{64}$/.test(commentRouterContext.comment_body_sha256 ?? '')\n  if (!validBaseContext) {\n    core.setFailed('The comment router context does not match this command')\n    return\n  }\n\n  if (\n    (commentRouterContext.event_type === 'discussion_comment') !==\n    (commentRouterContext.item_type === 'discussion')\n  ) {\n    core.setFailed('The routed event type does not match the triggering item')\n    return\n  }\n\n  const routerRun = await github.rest.actions.getWorkflowRun({\n    ...context.repo,\n    run_id: commentRouterContext.router_run_id,\n  })\n  const run = routerRun.data\n  if (\n    run.repository?.full_name?.toLowerCase() !== expectedRepository ||\n    run.path !== process.env.ROUTER_WORKFLOW ||\n    run.event !== commentRouterContext.event_type ||\n    run.actor?.login?.toLowerCase() !== commentRouterContext.actor.toLowerCase()\n  ) {\n    core.setFailed('The comment router context does not match its router run')\n    return\n  }\n\n  let sourceComment\n  if (commentRouterContext.item_type === 'discussion') {\n    if (typeof commentRouterContext.comment_node_id !== 'string') {\n      core.setFailed('The routed Discussion comment node ID is missing')\n      return\n    }\n    const response = await github.graphql(\n      `query($id: ID!) {\n        node(id: $id) {\n          ... on DiscussionComment {\n            id\n            databaseId\n            body\n            updatedAt\n            author { login }\n            discussion {\n              number\n              repository { nameWithOwner }\n              category { slug }\n            }\n          }\n        }\n      }`,\n      { id: commentRouterContext.comment_node_id }\n    )\n    const comment = response.node\n    if (\n      comment?.id !== commentRouterContext.comment_node_id ||\n      comment.databaseId !== commentRouterContext.comment_id ||\n      comment.discussion?.number !== commentRouterContext.item_number ||\n      comment.discussion.repository?.nameWithOwner?.toLowerCase() !== expectedRepository ||\n      comment.discussion.category?.slug !== 'proposals'\n    ) {\n      core.setFailed('The routed comment is not on the expected Proposal Discussion')\n      return\n    }\n    sourceComment = comment\n  } else {\n    const [commentResponse, issueResponse] = await Promise.all([\n      github.rest.issues.getComment({\n        ...context.repo,\n        comment_id: commentRouterContext.comment_id,\n      }),\n      github.rest.issues.get({\n        ...context.repo,\n        issue_number: commentRouterContext.item_number,\n      }),\n    ])\n    const comment = commentResponse.data\n    const issuePath = new URL(comment.issue_url).pathname.toLowerCase()\n    const expectedIssuePath =\n      `/repos/${expectedRepository}/issues/${commentRouterContext.item_number}`\n    const isPullRequest = Boolean(issueResponse.data.pull_request)\n    if (\n      issuePath !== expectedIssuePath ||\n      isPullRequest !== (commentRouterContext.item_type === 'pull_request')\n    ) {\n      core.setFailed('The routed comment is not on the expected issue or pull request')\n      return\n    }\n    sourceComment = comment\n  }\n\n  const author = sourceComment.author?.login ?? sourceComment.user?.login\n  const body = sourceComment.body ?? ''\n  if (\n    author?.toLowerCase() !== commentRouterContext.actor.toLowerCase() ||\n    !(await isRepositoryAdmin(author)) ||\n    !hasExactBotMention(body) ||\n    (sourceComment.updatedAt ?? sourceComment.updated_at) !==\n      commentRouterContext.comment_updated_at ||\n    bodyHash(body) !== commentRouterContext.comment_body_sha256\n  ) {\n    core.setFailed('The routed administrator comment is no longer valid')\n    return\n  }\n\n  return\n}\n\nif (context.eventName === 'issue_comment' || context.eventName === 'discussion_comment') {\n  return\n}\n\nif (context.payload.action !== 'labeled') {\n  core.setFailed('Expected a slash-command comment, labeled event, or routed dispatch')\n  return\n}\n\nconst labelName = context.payload.label?.name\nconst sender = context.payload.sender?.login\nconst expectedWorkflow = workflowByName[context.workflow]\nconst itemType = context.payload.issue?.pull_request || context.payload.pull_request\n  ? 'pull_request'\n  : 'issue'\nconst isReviewHandoff = context.workflow === '/implement' && labelName === 'aw:implement-bot'\nif (\n  !expectedWorkflow ||\n  (!isReviewHandoff && labelName !== `aw:${expectedWorkflow.workflow}`) ||\n  !expectedWorkflow.itemTypes.includes(itemType) ||\n  !sender\n) {\n  core.setFailed('The trigger label and item type must match this command')\n  return\n}\nif (isReviewHandoff) {\n  if (\n    sender.toLowerCase() !== botLogin || context.eventName !== 'issues' ||\n    itemType !== 'issue' || context.payload.issue?.state !== 'open'\n  ) {\n    core.setFailed('Only remix-run-bot may request a reviewed implementation of an open issue')\n  }\n  return\n}\nif (sender.toLowerCase() === botLogin) {\n  core.setFailed('Bot-added command labels are acknowledgments, not triggers')\n  return\n}\nif (!(await isRepositoryAdmin(sender))) {\n  core.setFailed('Only a repository administrator may apply this label')\n  return\n}\n"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
