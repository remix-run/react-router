          WORKFLOW_NAME: "/review proposal"
          WORKFLOW_DESCRIPTION: "Perform an admin-requested read-only review of a Proposal Discussion"
          HAS_PATCH: ${{ needs.agent.outputs.has_patch }}
          GH_AW_DETECTION_CONTINUE_ON_ERROR: "false"
        run: |
